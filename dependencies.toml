# Asuka Fonts 依赖配置

[iosevka]
repo = "https://github.com/be5invis/Iosevka.git"
# 锁定 tag 构建（参考 hanekokoro-fonts 固定 Iosevka 版本），
# 避免 main 分支 API 漂移导致构建失败
tag = "v34.8.1"

[nerd-fonts]
repo = "https://github.com/ryanoasis/nerd-fonts"
version = "3.3.0"

# 霞鹜文楷 - 用于 AsukaMono 的非西文字符
[lxgw-wenkai]
repo = "https://github.com/lxgw/LxgwWenKai"
version = "1.522"

  # 等宽版本（Mono）
  [lxgw-wenkai.mono]
  Light = "LXGWWenKaiMono-Light.ttf"
  Regular = "LXGWWenKaiMono-Regular.ttf"
  Medium = "LXGWWenKaiMono-Medium.ttf"

  # 比例版本（用于 Sans）
  [lxgw-wenkai.proportional]
  Light = "LXGWWenKai-Light.ttf"
  Regular = "LXGWWenKai-Regular.ttf"
  Medium = "LXGWWenKai-Medium.ttf"

# 得意黑 - 用于 AsukaSans 的非西文字符
[smiley-sans]
repo = "https://github.com/atelier-anchor/smiley-sans"
version = "2.0.1"

# Iosevka 构建字重
[build-weights]
thin = "100"
light = "300"
regular = "400"
medium = "500"
semibold = "600"
bold = "700"
extrabold = "800"
heavy = "900"
