# Asuka Fonts 依赖配置

[iosevka]
repo = "https://github.com/be5invis/Iosevka.git"
# 锁定 tag 构建（参考 hanekokoro-fonts 固定 Iosevka 版本），
# 避免 main 分支 API 漂移导致构建失败
tag = "v34.8.1"

[nerd-fonts]
repo = "https://github.com/ryanoasis/nerd-fonts"
version = "3.3.0"

[noto-cjk]
repo = "https://github.com/notofonts/noto-cjk"
version = "2.004"

  # 等宽版本（Noto CJK 2.004 起以 zip 分发，Mono 仅含 Regular/Bold）
  [noto-cjk.mono]
  Regular.sc = "NotoSansMonoCJKsc-Regular.otf"
  Regular.jp = "NotoSansMonoCJKjp-Regular.otf"
  Bold.sc = "NotoSansMonoCJKsc-Bold.otf"
  Bold.jp = "NotoSansMonoCJKjp-Bold.otf"
  # Noto Mono CJK 没有 Light 字重，Light 字重回退使用 Regular
  Light.sc = "NotoSansMonoCJKsc-Regular.otf"
  Light.jp = "NotoSansMonoCJKjp-Regular.otf"

  # 比例版本
  [noto-cjk.sans]
  Regular.sc = "NotoSansCJKsc-Regular.otf"
  Regular.jp = "NotoSansCJKjp-Regular.otf"
  Bold.sc = "NotoSansCJKsc-Bold.otf"
  Bold.jp = "NotoSansCJKjp-Bold.otf"
  Light.sc = "NotoSansCJKsc-Light.otf"
  Light.jp = "NotoSansCJKjp-Light.otf"

# Iosevka 构建字重
[build-weights]
thin = "100"
light = "300"
regular = "400"
medium = "500"
semibold = "600"
bold = "700"
extrabold = "800"
heavy = "900"
