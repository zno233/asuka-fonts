# ============================================================
# 优先级说明
# ============================================================

# Priority 0: 最高优先级（Nerd Fonts 图标等必须包含的）
# Priority 1: 核心字符（ASCII、拉丁文、常见符号、CJK 基础）
# Priority 2: 扩展字符（补充字符、常用扩展）
# Priority 3: 罕见字符（极少使用、可选）
