name: Build Asuka Fonts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwoff-dev \
            ttfautohint \
            ccache
          pip install fonttools brotli toml

      - name: Read dependency versions
        id: deps
        run: |
          NF_VERSION=$(python3 -c "import toml; c=toml.load('dependencies.toml'); print(c['nerd-fonts']['version'])")
          LXGW_VERSION=$(python3 -c "import toml; c=toml.load('dependencies.toml'); print(c['lxgw-wenkai']['version'])")
          SMILEY_VERSION=$(python3 -c "import toml; c=toml.load('dependencies.toml'); print(c['smiley-sans']['version'])")
          IOSEVKA_REF=$(python3 -c "import toml; c=toml.load('dependencies.toml'); print(c['iosevka'].get('tag') or c['iosevka'].get('branch', 'main'))")

          echo "nf_version=$NF_VERSION" >> $GITHUB_OUTPUT
          echo "lxgw_version=$LXGW_VERSION" >> $GITHUB_OUTPUT
          echo "smiley_version=$SMILEY_VERSION" >> $GITHUB_OUTPUT
          echo "iosevka_ref=$IOSEVKA_REF" >> $GITHUB_OUTPUT

      - name: Clone Iosevka
        run: |
          IOSEVKA_REF=${{ steps.deps.outputs.iosevka_ref }}
          echo "Cloning Iosevka (ref: $IOSEVKA_REF)..."
          git clone --depth 1 --branch $IOSEVKA_REF \
            https://github.com/be5invis/Iosevka.git sources/Iosevka
          cd sources/Iosevka
          npm install

      - name: Build Iosevka fonts
        run: |
          cd sources/Iosevka

          # 复制自定义构建计划
          cp ../../private-build-plans.toml .

          # 注意：Iosevka 34+ 的 verda 目标格式为 ttf::<plan>，
          # 字重由 private-build-plans.toml 中的 [buildPlans.*.weights] 决定，
          # 不再支持 "ttf::<plan>::<weight>" 这种 CLI 写法
          echo "Building AsukaMono (weights: Light/Regular/Bold)..."
          ISEVKA_FORCEOMELET=1 npm run build -- ttf::AsukaMono

          echo "Building AsukaSans (weights: Light/Regular/Bold)..."
          ISEVKA_FORCEOMELET=1 npm run build -- ttf::AsukaSans

          echo "Build complete!"
          find . -name "*.ttf" -path "*/dist/*"

      - name: Download Nerd Fonts icons
        run: |
          NF_VERSION=${{ steps.deps.outputs.nf_version }}
          mkdir -p sources/nerd-fonts

          echo "Downloading Nerd Fonts v${NF_VERSION}..."
          wget -q -O sources/Iosevka.zip \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/v${NF_VERSION}/Iosevka.zip"

          # 提取图标字形（Mono 用于 AsukaMono，Propo 用于 AsukaSans）
          python3 scripts/extract-zip.py sources/Iosevka.zip sources/nerd-fonts \
            --name IosevkaNerdFontMono-Regular.ttf \
            --name IosevkaNerdFontPropo-Regular.ttf \
            --required
          ls -lh sources/nerd-fonts/

      - name: Download LxgwWenKai Mono
        run: |
          LXGW_VERSION=${{ steps.deps.outputs.lxgw_version }}
          mkdir -p sources/non-latin

          echo "Downloading LxgwWenKai Mono v${LXGW_VERSION}..."
          for weight in Light Regular Medium; do
            curl -fL -o "sources/non-latin/LXGWWenKaiMono-${weight}.ttf" \
              "https://github.com/lxgw/LxgwWenKai/releases/download/v${LXGW_VERSION}/LXGWWenKaiMono-${weight}.ttf"
          done

          echo "Download complete!"
          ls -lh sources/non-latin/LXGWWenKaiMono-*.ttf

      - name: Download Smiley Sans
        run: |
          SMILEY_VERSION=${{ steps.deps.outputs.smiley_version }}
          mkdir -p sources/non-latin

          echo "Downloading Smiley Sans v${SMILEY_VERSION}..."
          curl -fL -o "sources/non-latin/smiley-sans.zip" \
            "https://github.com/atelier-anchor/smiley-sans/releases/download/v${SMILEY_VERSION}/smiley-sans-v${SMILEY_VERSION}.zip"
          python3 scripts/extract-zip.py "sources/non-latin/smiley-sans.zip" sources/non-latin --suffix .ttf
          rm "sources/non-latin/smiley-sans.zip"

          echo "Extracted files:"
          ls -lh sources/non-latin/

      - name: Merge Nerd Fonts icons
        run: |
          echo "Merging Nerd Fonts icons into built fonts..."
          mkdir -p sources/patched

          # 只处理 Upright 样式（Nerd Fonts 只有 Regular 字重，非西文字体只有 Upright）
          WEIGHTS="Light Regular Bold"

          for weight in $WEIGHTS; do
            # Iosevka 输出可能在 TTF/ 或 TTF-Unhinted/ 目录
            mono_font=""
            for dir in TTF TTF-Unhinted; do
              candidate="sources/Iosevka/dist/AsukaMono/${dir}/AsukaMono-${weight}.ttf"
              if [ -f "$candidate" ]; then
                mono_font="$candidate"
                break
              fi
            done
            if [ -n "$mono_font" ]; then
              echo "Patching Mono ${weight} (from $mono_font)..."
              python3 scripts/apply-nerd-icons.py \
                --base "$mono_font" \
                --icons sources/nerd-fonts/IosevkaNerdFontMono-Regular.ttf \
                --output "sources/patched/"
            fi

            sans_font=""
            for dir in TTF TTF-Unhinted; do
              candidate="sources/Iosevka/dist/AsukaSans/${dir}/AsukaSans-${weight}.ttf"
              if [ -f "$candidate" ]; then
                sans_font="$candidate"
                break
              fi
            done
            if [ -n "$sans_font" ]; then
              echo "Patching Sans ${weight} (from $sans_font)..."
              python3 scripts/apply-nerd-icons.py \
                --base "$sans_font" \
                --icons sources/nerd-fonts/IosevkaNerdFontPropo-Regular.ttf \
                --output "sources/patched/"
            fi
          done

          echo "Patched fonts:"
          ls -lh sources/patched/

      - name: Merge non-Latin fonts
        run: |
          echo "Merging non-Latin fonts..."
          mkdir -p releases/mono releases/sans

          WEIGHTS="Light Regular Bold"

          for weight in $WEIGHTS; do
            # Mono（使用 LxgwWenKai Mono）
            mono_font="sources/patched/AsukaMono-${weight}.ttf"
            if [ -f "$mono_font" ]; then
              # LxgwWenKai Mono 没有 Bold 字重，回退使用 Medium
              non_latin_weight="$weight"
              if [ "$non_latin_weight" = "Bold" ]; then
                non_latin_weight="Medium"
              fi
              LXGW_TTF="sources/non-latin/LXGWWenKaiMono-${non_latin_weight}.ttf"
              if [ -f "$LXGW_TTF" ]; then
                echo "Merging LxgwWenKai Mono into AsukaMono ${weight} (weight: ${non_latin_weight})..."
                python3 scripts/merge-fonts.py \
                  --base "$mono_font" \
                  --non-latin "$LXGW_TTF" \
                  --output "releases/mono/"
              else
                echo "Warning: $LXGW_TTF not found, skipping AsukaMono ${weight}"
              fi
            fi

            # Sans（使用 Smiley Sans）
            sans_font="sources/patched/AsukaSans-${weight}.ttf"
            if [ -f "$sans_font" ]; then
              SMILEY_TTF=$(find sources/non-latin -name "*.ttf" -not -name "LXGWWenKai*" -type f | head -1)
              if [ -n "$SMILEY_TTF" ]; then
                echo "Merging Smiley Sans ($SMILEY_TTF) into AsukaSans ${weight}..."
                python3 scripts/merge-fonts.py \
                  --base "$sans_font" \
                  --non-latin "$SMILEY_TTF" \
                  --output "releases/sans/"
              else
                echo "Warning: No Smiley Sans ttf found, skipping AsukaSans ${weight}"
              fi
            fi
          done

          echo "Merged fonts:"
          ls -lh releases/mono/ releases/sans/

      - name: Organize releases
        run: |
          mkdir -p releases/final
          cp releases/mono/*.ttf releases/final/ 2>/dev/null || true
          cp releases/sans/*.ttf releases/final/ 2>/dev/null || true
          rm -rf releases/mono releases/sans

          echo "Release files:"
          ls -lh releases/final/

      - name: Verify fonts
        run: |
          python3 scripts/verify-fonts.py releases/final/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: asuka-fonts
          path: releases/final/*.ttf

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/final/*.ttf
          generate_release_notes: true
          draft: false
          prerelease: false
